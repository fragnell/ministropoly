name: Pubblica su GitHub Pages

# Pubblica l'app compilata (cartella dist/) su GitHub Pages.
# Attenzione: GitHub Pages è un hosting statico. Funzionano la «Demo locale» e la modalità «Online (Firebase)»;
# la modalità «Rete locale» richiede il server incluso (npm run lan) e non è disponibile su Pages.
#
# Configurazione (una volta sola):
#  1. Repository → Settings → Pages → Source: «GitHub Actions»
#  2. Per la modalità online, aggiungi i secrets del repository (Settings → Secrets and variables → Actions):
#     VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_DATABASE_URL,
#     VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_APP_ID
#     (non sono segreti in senso stretto: finiscono comunque nel codice inviato al browser)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test del motore delle regole
        run: npm test
      - name: Compilazione
        run: npm run build
        env:
          # Percorsi relativi: l'app usa un router basato sull'hash e funziona in qualunque sottocartella
          VITE_BASE: ./
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
